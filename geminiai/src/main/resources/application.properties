spring.application.name=geminiai
# Logging for debugging client/spec level
# logging.level.io.modelcontextprotocol.client=DEBUG
# logging.level.io.modelcontextprotocol.spec=DEBUG

# server port
server.port=8086

# Spring AI Gemini configuration (via OpenAI-compatible endpoint)

spring.ai.openai.api-key={your-gemini-api-key}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=gemini-2.5-flash



